version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: mtruong-store-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-mtruong_store}
      MYSQL_USER: ${DB_USER:-store_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-store_password}
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./prisma/migrations:/docker-entrypoint-initdb.d
    networks:
      - mtruong-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mtruong-store-app
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://${DB_USER:-store_user}:${DB_PASSWORD:-store_password}@mysql:3306/${DB_NAME:-mtruong_store}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mtruong-network

volumes:
  mysql_data:
    driver: local

networks:
  mtruong-network:
    driver: bridge