name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: mtruong_store_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: "mysql://root@127.0.0.1:3306/mtruong_store_test"
      JWT_ACCESS_SECRET: "ci-access-secret-that-is-at-least-32-characters"
      JWT_REFRESH_SECRET: "ci-refresh-secret-that-is-at-least-32-characters"
      REFRESH_TOKEN_TTL: "604800"
      NEXT_PUBLIC_APP_URL: "https://example.com"
      STORAGE_PROVIDER: "cloudinary"
      CLOUDINARY_CLOUD_NAME: "ci_dummy"
      CLOUDINARY_API_KEY: "1234567890"
      CLOUDINARY_API_SECRET: "ci_dummy_secret"
      NOTIFICATION_PROVIDER: "webhook"
      NOTIFICATION_EMAIL_WEBHOOK_URL: "https://notify.example.com/email"
      NOTIFICATION_ALLOWED_HOSTS: "notify.example.com"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deploy Migrations to CI MySQL
        run: npx prisma migrate deploy

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Security Tests
        run: npm run test:security

      - name: Run Money Static Audit
        run: npm run money:static

      - name: Run Order State Audit
        run: npm run order-state:audit

      - name: Run Production Build
        run: npm run build
