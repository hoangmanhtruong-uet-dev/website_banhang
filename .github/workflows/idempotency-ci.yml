name: Idempotency CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration_root_password
          MYSQL_DATABASE: website_ban_hang_idempotency_test
          MYSQL_USER: idem_test
          MYSQL_PASSWORD: idem_test_password
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uidem_test -pidem_test_password --silent"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
    env:
      TEST_DATABASE_URL: mysql://idem_test:idem_test_password@127.0.0.1:3308/website_ban_hang_idempotency_test
      INTEGRATION_DB_MANAGED: "1"
      JWT_ACCESS_SECRET: integration-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: integration-refresh-secret-at-least-32-characters
      WEBHOOK_SECRET: integration-webhook-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run test:idempotency:integration
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build