name: website_ban_hang_idempotency_test

services:
  mysql-idempotency-test:
    image: mysql:8.0
    container_name: mtruong-idempotency-test-mysql
    environment:
      MYSQL_ROOT_PASSWORD: integration_root_password
      MYSQL_DATABASE: website_ban_hang_idempotency_test
      MYSQL_USER: idem_test
      MYSQL_PASSWORD: idem_test_password
    ports:
      - "3308:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s